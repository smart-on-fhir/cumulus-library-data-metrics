name: Regression
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
  workflow_dispatch:

# The goal here is to cancel older workflows when a PR is updated (because it's pointless work)
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:

  # Note: regression job should not be matrixed due to remote db concurrency issue
  regression:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      # See https://github.com/aws-actions/configure-aws-credentials for configuring
      # the aws side of this - the below action is just a light wrapper
      - name: Configure AWS Credentials
        uses: mcblair/configure-aws-profile-action@v1.0.0
        with:
          role-arn: arn:aws:iam::${{secrets.AWS_ACCOUNT}}:role/cumulus-study-ci
          region: us-east-1
          profile-name: cumulus-study-ci
      - name: Rebuild tables
        env:
          PROFILE: cumulus-study-ci
          WG: cumulus
          DB: cumulus_epic_regression_db
        run: |
          cumulus-library build -t data_metrics --profile $PROFILE --workgroup $WG --database $DB > /dev/null
          cumulus-library export -t data_metrics ./tests/regression/data_export/ --profile $PROFILE --workgroup $WG --database $DB > /dev/null

  